<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hacker Adhaar Card</title>
  
  <meta name="twitter:card" content="summary_large_image">
  <meta id="meta-title" name="twitter:title" content="Hacker Adhaar Card">
  <meta name="twitter:description" content="Department of Hackers - Hacker House Goa 2026.">
  <meta id="meta-image" name="twitter:image" content="">

  <script>
    const params = new URLSearchParams(window.location.search);
    const imgUrl = params.get('img');
    const name = params.get('name') || 'Hacker';
    const skills = params.get('skills') || '';
    const role = params.get('role') || '';

    if (imgUrl) {
      document.getElementById('meta-image').setAttribute('content', decodeURIComponent(imgUrl));
      document.getElementById('meta-title').setAttribute('content', `${name}'s Hacker Adhaar Card`);
    }

    // Fallback client-side redirection to match TanStack Router params exactly
    window.location.replace(`/card?name=${encodeURIComponent(name)}&skills=${encodeURIComponent(skills)}&role=${encodeURIComponent(role)}&imageSrc=${encodeURIComponent(imgUrl)}`);
  </script>
</head>
<body>
  <p>Loading card...</p>
</body>
</html>
